<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>天气形势智能诊断 MVP</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/map.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">跳到地图</a>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>天气形势智能诊断</h1>
        <span>EC NetCDF → 物理量诊断 → 天气系统识别</span>
      </div>
      <div class="mode-strip" aria-label="模式与运行控制">
        <label class="control-field">
          <span>模式</span>
          <select id="modelSelect" disabled>
            <option>ECMWF</option>
          </select>
        </label>
        <label class="control-field run-field" hidden>
          <span>诊断产品</span>
          <select id="runSelect"></select>
        </label>
        <label class="control-field point-data-field" hidden>
          <span>点查数据</span>
          <select id="pointDataCodeSelect" aria-label="点位诊断数据编码"></select>
        </label>
        <label class="control-field point-run-field">
          <span>起报</span>
          <select id="pointRunTimeSelect" aria-label="点位诊断起报时次"></select>
        </label>
        <button id="btnPointProbe" class="point-probe-toggle" type="button" aria-pressed="false">点位诊断</button>
        <button id="btnDemo" class="secondary-action">示例数据</button>
        <button id="btnDiagnose">运行诊断</button>
      </div>
    </header>

    <main id="main-content" class="map-stage">
      <div id="map" class="map" aria-label="天气诊断 GIS 地图">
        <div class="map-status">
          <span id="status">准备就绪</span>
        </div>

        <aside class="layer-panel" aria-label="要素、风险与天气系统">
          <section class="panel-section">
            <div class="section-head">
              <h2>要素</h2>
              <div class="section-actions">
                <button id="btnClearOverlays" class="ghost-button quiet-button" type="button">清空</button>
                <button id="btnLoadLayer" class="ghost-button" type="button">刷新</button>
              </div>
            </div>
            <label class="layer-source-control" hidden>
              <span>图层数据</span>
              <select id="layerSourceSelect" aria-label="图层数据源">
                <option value="nafp" selected>NAFP 原始格点</option>
                <option value="product">诊断产品</option>
              </select>
            </label>
            <select id="layerSelect" class="visually-hidden" aria-label="诊断要素"></select>
            <div id="layerChips" class="layer-chips"></div>
            <label class="contour-toggle">
              <input id="contourToggle" type="checkbox" checked />
              <span>等值线</span>
            </label>
          </section>

          <section class="panel-section">
            <div class="section-head">
              <h2>风险</h2>
              <div class="section-actions">
                <button id="btnClearFeatures" class="ghost-button quiet-button" type="button">清空</button>
                <button id="btnLoadFeatures" class="ghost-button" type="button">刷新</button>
              </div>
            </div>
            <div class="panel-subsection">
              <strong class="panel-subtitle">风险图层</strong>
              <div id="riskLayerChips" class="layer-chips"></div>
            </div>
            <div class="panel-subsection">
              <strong class="panel-subtitle">风险对象</strong>
              <div class="checkboxes feature-grid" id="riskFeatureToggles"></div>
            </div>
          </section>

          <section class="panel-section">
            <div class="section-head">
              <h2>天气系统</h2>
            </div>
            <div class="checkboxes feature-grid" id="featureToggles"></div>
          </section>

          <section class="panel-section feature-index-panel">
            <div class="section-head compact-head">
              <h2>对象索引</h2>
              <span id="featureIndexSummary" class="feature-index-summary">尚未加载对象</span>
            </div>
            <div class="feature-index-controls">
              <label>
                <span>类型</span>
                <select id="featureIndexTypeFilter" aria-label="对象类型筛选"></select>
              </label>
              <label>
                <span>可信度</span>
                <select id="featureIndexQualityFilter" aria-label="可信度筛选">
                  <option value="all">全部</option>
                  <option value="pending">待核验</option>
                  <option value="low">低可信</option>
                  <option value="moderate">中可信</option>
                  <option value="high">高可信</option>
                </select>
              </label>
            </div>
            <div id="featureIndexList" class="feature-index-list"></div>
          </section>
        </aside>

        <aside class="analysis-panel" aria-label="诊断信息">
          <h2 id="analysisTitle">自动形势分析</h2>
          <pre id="analysisText">暂无分析。点击“示例数据”并“运行诊断”。</pre>
          <div class="detail-heading">
            <h2 id="detailTitle">对象详情</h2>
            <span id="pointProbeBadge" class="probe-badge" hidden>点位诊断</span>
          </div>
          <div id="featureDetail" class="object-detail-panel plain">点击地图对象查看证据。</div>
          <div id="pointDiagnosisPanel" class="point-diagnosis-panel" hidden></div>
        </aside>

        <div id="mapLegend" class="map-legend" hidden>
          <strong id="legendTitle">诊断图层</strong>
          <div id="legendRamp" class="legend-ramp"></div>
          <div class="legend-labels">
            <span id="legendMin">低值</span>
            <span id="legendMax">高值</span>
          </div>
        </div>
      </div>
    </main>

    <footer class="timeline-bar" aria-label="预报时效时间轴">
      <button id="btnStepPrev" class="timeline-step">上一时效</button>
      <div class="time-readout">
        <span>预报时效</span>
        <strong id="currentTimeLabel">+24小时</strong>
      </div>
      <div id="timelineHours" class="timeline-hours"></div>
      <button id="btnStepNext" class="timeline-step">下一时效</button>
      <select id="fhSelect" class="visually-hidden" aria-label="预报时效"></select>
    </footer>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="/static/maplibre-utils.js"></script>
  <script src="/static/map.js"></script>
</body>
</html>
