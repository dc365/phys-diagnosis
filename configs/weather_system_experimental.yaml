# 新增天气系统实验参数。
# 这些参数可逐步合并到 thresholds.yaml 或后台阈值矩阵中。

pv_anomaly:
  preferred_levels_hpa: [300]
  pv_percentile: 90
  pv_min: 1.5
  min_area_grid_points: 8
  max_objects: 8
  smoothing_sigma_grid: 1.0
  require_positive_pv_advection: false
  mid_dry_rh_max: 65

surface_boundary:
  score_percentile: 86
  temp_gradient_percentile: 80
  min_area_grid_points: 8
  min_length_km: 120
  max_objects: 8
  smoothing_sigma_grid: 1.0

