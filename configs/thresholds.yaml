# 阈值初值用于业务化试运行，真实区域必须通过历史个例持续校准。
pressure_system:
  min_prominence_hpa: 0.5
  # 多模式/多分辨率优先使用物理距离；grid 参数保留为兼容回退。
  min_distance_km: 550
  min_distance_grid: 6
  max_centers: 20
  contour_interval_hpa: 1.0
  min_closed_contours: 2
  max_closed_contours: 8
  edge_margin_km: 150
  edge_margin_grid: 2
  min_closed_area_km2: 50000
  smoothing_sigma_grid: 1.0

subtropical_high:
  level_hpa: 500
  contour_gpm: 5880
  auto_unit: true
  min_area_grid_points: 20
  # 5880gpm 区域由格点掩膜生成，默认对业务展示边界做保守平滑，避免地图上出现明显台阶。
  smooth_boundary: true
  boundary_smooth_km: 90
  boundary_simplify_km: 30

convergence:
  low_level_hpa: 850
  divergence_max: -1.0e-5
  divergence_percentile: 10
  convergence_min: 1.0e-5
  min_mean_convergence: 3.0e-6
  morphology_opening_grid: 0
  morphology_closing_grid: 1
  min_area_grid_points: 12
  min_area_km2: 30000
  smoothing_sigma_grid: 1.0
  max_objects: 12

upper_divergence:
  preferred_levels_hpa: [200, 300]
  divergence_min: 1.0e-5
  divergence_percentile: 90
  min_mean_divergence: 3.0e-6
  morphology_opening_grid: 0
  morphology_closing_grid: 1
  min_area_grid_points: 12
  min_area_km2: 30000
  smoothing_sigma_grid: 1.0
  max_objects: 12

low_level_jet:
  level_hpa: 850
  wind_speed_min_ms: 12.0
  moisture_flux_percentile: 70
  min_area_grid_points: 10
  min_direction_coherence: 0.65
  max_objects: 12
  rank_length_cap_km: 1800
  rank_mean_weight: 0.35
  rank_max_weight: 0.30
  rank_length_weight: 0.20
  rank_coherence_weight: 0.15
  streamline_max_turn_deg: 55
  streamline_allow_gap_grid: 1

moisture_transport:
  level_hpa: 850
  flux_percentile: 75
  min_area_grid_points: 12
  min_direction_coherence: 0.65
  max_objects: 12
  rank_length_cap_km: 1800
  rank_mean_weight: 0.35
  rank_max_weight: 0.30
  rank_length_weight: 0.20
  rank_coherence_weight: 0.15
  streamline_max_turn_deg: 55
  streamline_allow_gap_grid: 1

front_candidate:
  level_hpa: 850
  temp_gradient_percentile: 80
  score_percentile: 82
  dynamic_support_percentile: 70
  min_support_components: 1
  min_area_grid_points: 10
  max_objects: 12
  # 业务图默认输出锋面轴线 LineString；调试时可改为 area。
  output_geometry: axis
  cross_front_wind_min_ms: 1.0
  stationary_cross_front_max_ms: 0.8
  front_type_consistency_min: 0.55
  front_type_mixed_gap: 0.15

shear_line:
  levels_hpa: [850, 700, 500]
  score_percentile: 84
  dynamic_percentile: 75
  vorticity_min: 1.0e-5
  convergence_min: 4.0e-6
  min_support_components: 2
  min_area_grid_points: 10
  min_length_km: 300
  max_objects: 8
  smoothing_sigma_grid: 1.0
  separate_front_with_shear: true
  front_gradient_percentile: 85
  front_with_shear_ratio_min: 0.45

vortex:
  levels_hpa: [850, 700, 500]
  smoothing_sigma_grid: 1.2
  min_distance_grid: 8
  max_objects: 8
  min_height_prominence: 20.0
  closed_height_interval: 20.0
  min_closed_area_km2: 40000
  vorticity_min: 1.0e-5

upper_jet:
  preferred_levels_hpa: [200, 300]
  wind_speed_min_ms: 30.0
  wind_speed_percentile: 85
  min_area_grid_points: 10
  min_direction_coherence: 0.60
  rank_length_cap_km: 2500
  max_objects: 8
  smoothing_sigma_grid: 1.0
  exit_divergence_min: 8.0e-6
  exit_divergence_percentile: 88
  exit_min_area_grid_points: 8
  exit_max_objects: 6

trough_ridge:
  level_hpa: 500
  # 保留旧参数，兼容 trough_ridge_axis_candidates 及历史调用。
  anomaly_percentile: 20
  curvature_percentile: 55
  smoothing_sigma_grid: 1.0
  min_points_per_line: 10
  max_lines: 6

  # NMC-style 天气尺度槽/脊线算法参数。
  # 识别先在天气尺度平滑场上找轴线，再输出 LineString，避免候选区被前端画成面。
  detect_ridge: true
  analysis_lat_min: 18
  analysis_lat_max: 68
  smooth_radius_km: 260
  second_smooth_radius_km: 130
  component_percentile: 86
  seed_percentile: 93
  min_length_km: 650
  max_sinuosity: 2.8
  axis_control_spacing_km: 280
  output_points: 26
  spline_smooth_factor: 3.2
  reject_tropical_zonal: true

