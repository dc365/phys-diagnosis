# 阈值初值仅用于 MVP 跑通。真实业务区域必须用历史个例调参。
pressure_system:
  min_prominence_hpa: 0.5
  min_distance_grid: 6
  max_centers: 20
  contour_interval_hpa: 1.0
  min_closed_contours: 2
  max_closed_contours: 8
  edge_margin_grid: 2
  smoothing_sigma_grid: 1.0

subtropical_high:
  level_hpa: 500
  contour_gpm: 5880
  min_area_grid_points: 20

convergence:
  low_level_hpa: 850
  divergence_max: -1.0e-5
  divergence_percentile: 10
  convergence_min: 1.0e-5
  min_area_grid_points: 12
  smoothing_sigma_grid: 1.0
  max_objects: 12

upper_divergence:
  preferred_levels_hpa: [200, 300]
  divergence_min: 1.0e-5
  divergence_percentile: 90
  min_area_grid_points: 12
  smoothing_sigma_grid: 1.0
  max_objects: 12

low_level_jet:
  level_hpa: 850
  wind_speed_min_ms: 12.0
  moisture_flux_percentile: 70
  min_area_grid_points: 10
  min_direction_coherence: 0.65
  max_objects: 12

moisture_transport:
  level_hpa: 850
  flux_percentile: 75
  min_area_grid_points: 12
  min_direction_coherence: 0.65
  max_objects: 12

front_candidate:
  level_hpa: 850
  temp_gradient_percentile: 80
  score_percentile: 82
  dynamic_support_percentile: 70
  min_support_components: 1
  min_area_grid_points: 10
  max_objects: 12

trough_ridge:
  level_hpa: 500
  anomaly_percentile: 20
  curvature_percentile: 55
  smoothing_sigma_grid: 1.0
  min_points_per_line: 4
  max_lines: 8

