layers:
  z500:
    title: 500hPa 位势高度
    variable: z500
    kind: raster
    unit: dagpm
    contour:
      enabled: true
      interval: 4
      max_segments: 16000
  mslp:
    title: 海平面气压
    variable: mslp
    kind: raster
    unit: hPa
    contour:
      enabled: true
      interval: 2
      max_segments: 16000
  t850:
    title: 850hPa 温度
    variable: t850
    kind: raster
    unit: degC
    contour:
      enabled: true
      interval: 2
      max_segments: 16000
  wind850_speed:
    title: 850hPa 风速
    variable: wind850_speed
    kind: raster
    unit: m/s
  div850:
    title: 850hPa 散度
    variable: div850
    kind: raster
    unit: s^-1
  vort500:
    title: 500hPa 相对涡度
    variable: vort500
    kind: raster
    unit: s^-1
  moisture_flux850:
    title: 850hPa 水汽通量
    variable: moisture_flux850
    kind: raster
    unit: kg kg^-1 m s^-1
  moisture_conv850:
    title: 850hPa 水汽辐合
    variable: moisture_conv850
    kind: raster
    unit: s^-1
  omega700:
    title: 700hPa 垂直速度 omega
    variable: omega700
    kind: raster
    unit: Pa/s
  temp_adv850:
    title: 850hPa 温度平流
    variable: temp_adv850
    kind: raster
    unit: K/s
  k_index:
    title: K 指数
    variable: k_index
    kind: raster
    unit: degC
  shear_0_6km:
    title: 0-6km 风切变近似
    variable: shear_0_6km
    kind: raster
    unit: m/s
  risk_persistent_heavy_rain_score:
    title: 持续性强降水风险评分
    variable: risk_persistent_heavy_rain_score
    kind: raster
    unit: 0-1
  risk_short_duration_heavy_rain_score:
    title: 短时强降水风险评分
    variable: risk_short_duration_heavy_rain_score
    kind: raster
    unit: 0-1
  risk_thunderstorm_gale_score:
    title: 雷暴大风/下击暴流风险评分
    variable: risk_thunderstorm_gale_score
    kind: raster
    unit: 0-1
  risk_hail_score:
    title: 冰雹风险评分
    variable: risk_hail_score
    kind: raster
    unit: 0-1
  risk_rotating_storm_score:
    title: 旋转风暴/超级单体潜势评分
    variable: risk_rotating_storm_score
    kind: raster
    unit: 0-1
  risk_severe_convection_composite_score:
    title: 强对流综合风险评分
    variable: risk_severe_convection_composite_score
    kind: raster
    unit: 0-1
