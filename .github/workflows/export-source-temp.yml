name: export-source-temp

on:
  push:
    branches:
      - codex/sounding-h500-v4-multitime
    paths:
      - ".github/workflows/export-source-temp.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Pack source snapshot
        run: |
          mkdir -p artifacts/source
          tar -czf artifacts/source/phys-diagnosis-source.tar.gz \
            weather_diag backend frontend tests scripts docs \
            pyproject.toml Makefile

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phys-diagnosis-source
          path: artifacts/source/phys-diagnosis-source.tar.gz
          retention-days: 1
