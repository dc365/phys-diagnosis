name: apply-h500-v4-patch-temp

on:
  push:
    branches:
      - codex/sounding-h500-v4-multitime
    paths:
      - "scripts/h500_v4_patch.part*"
      - ".github/workflows/apply-h500-v4-patch-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/sounding-h500-v4-multitime
          fetch-depth: 0

      - name: Decode and apply patch snapshot
        shell: bash
        run: |
          cat scripts/h500_v4_patch.part00 \
              scripts/h500_v4_patch.part01 \
              scripts/h500_v4_patch.part02 \
              scripts/h500_v4_patch.part03 \
              scripts/h500_v4_patch.part04 > /tmp/h500-v4-patch.b64
          base64 --decode /tmp/h500-v4-patch.b64 > /tmp/h500-v4-patch.tar.gz
          tar -xzf /tmp/h500-v4-patch.tar.gz
          python -m py_compile \
            weather_diag/features/sounding_trough_paths.py \
            weather_diag/diagnosis/sounding_optimized.py \
            tests/test_sounding_analysis.py \
            tests/test_sounding_h500_v4.py \
            scripts/render_sounding_h500_multitime.py
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            weather_diag/features/sounding_trough_paths.py \
            weather_diag/diagnosis/sounding_optimized.py \
            tests/test_sounding_analysis.py \
            tests/test_sounding_h500_v4.py \
            scripts/render_sounding_h500_multitime.py
          if git diff --cached --quiet; then
            echo "Implementation already applied"
            exit 0
          fi
          git commit -m "Generalize station-only H500 trough and shear paths"
          git push origin HEAD:codex/sounding-h500-v4-multitime
