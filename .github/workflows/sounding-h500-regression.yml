name: sounding-h500-regression

on:
  pull_request:
    branches:
      - codex/multi-hazard-risk-grids
    paths:
      - "weather_diag/diagnosis/__init__.py"
      - "weather_diag/diagnosis/objective_analysis.py"
      - "weather_diag/diagnosis/sounding.py"
      - "weather_diag/diagnosis/sounding_optimized.py"
      - "weather_diag/diagnosis/sounding_z500_adaptive.py"
      - "weather_diag/diagnosis/sounding_z500_v4.py"
      - "weather_diag/features/trough_ridge.py"
      - "weather_diag/features/contour_trough.py"
      - "weather_diag/features/sounding_trough_paths.py"
      - "weather_diag/features/sounding_geometry_refine.py"
      - "weather_diag/features/__init__.py"
      - "backend/app/api/v1/sounding.py"
      - "scripts/render_sounding_h500_regression.py"
      - "scripts/render_sounding_h500_multitime.py"
      - "tests/test_sounding_analysis.py"
      - "tests/test_contour_seeded_trough.py"
      - "tests/test_trough_ridge_features.py"
      - "tests/test_sounding_h500_v4.py"
      - "tests/test_sounding_geometry_refine.py"
      - ".github/workflows/sounding-h500-regression.yml"
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Render four-cycle diagnostics
        shell: bash
        run: |
          mkdir -p artifacts/sounding-h500-multitime
          set +e
          python scripts/render_sounding_h500_multitime.py 2>&1 | tee artifacts/sounding-h500-multitime/render.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/sounding-h500-multitime/render.exit-code
          exit "$code"

      - name: Upload H500 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sounding-h500-multitime
          path: artifacts/sounding-h500-multitime
          if-no-files-found: error
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Run focused regression tests
        shell: bash
        run: |
          mkdir -p artifacts/sounding-h500-tests
          set +e
          pytest -vv --maxfail=8 \
            tests/test_contour_seeded_trough.py \
            tests/test_trough_ridge_features.py \
            tests/test_sounding_analysis.py \
            tests/test_sounding_h500_v4.py \
            tests/test_sounding_geometry_refine.py \
            2>&1 | tee artifacts/sounding-h500-tests/pytest.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/sounding-h500-tests/pytest.exit-code
          exit "$code"

      - name: Upload focused regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sounding-h500-tests
          path: artifacts/sounding-h500-tests
          if-no-files-found: error
          retention-days: 14
