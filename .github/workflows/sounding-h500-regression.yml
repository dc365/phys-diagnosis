name: sounding-h500-regression

on:
  pull_request:
    branches:
      - codex/multi-hazard-risk-grids
    paths:
      - "weather_diag/diagnosis/__init__.py"
      - "weather_diag/diagnosis/objective_analysis.py"
      - "weather_diag/diagnosis/sounding.py"
      - "weather_diag/diagnosis/sounding_optimized.py"
      - "weather_diag/diagnosis/sounding_z500_adaptive.py"
      - "weather_diag/features/trough_ridge.py"
      - "weather_diag/features/contour_trough.py"
      - "weather_diag/features/__init__.py"
      - "backend/app/api/v1/sounding.py"
      - "scripts/render_sounding_h500_regression.py"
      - "scripts/render_sounding_h500_wind_experiment.py"
      - "tests/test_sounding_analysis.py"
      - "tests/test_contour_seeded_trough.py"
      - "tests/test_trough_ridge_features.py"
      - ".github/workflows/sounding-h500-regression.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  migrate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Align Hainan regression with public system contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_sounding_analysis.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert any(
              item["candidate_source"] == "meridional_valley_track"
              and item.get("supplement_region") == "south_china_hainan"
              for item in hainan_axes
          )
          '''
          new = '''    assert any(
              item["candidate_source"] == "meridional_valley_track"
              and str(item.get("id") or "").startswith("trough_south_china_hainan")
              for item in hainan_axes
          )
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif "trough_south_china_hainan" not in text:
              raise SystemExit("Hainan regression assertion not found")
          PY

      - name: Commit test migration when needed
        shell: bash
        run: |
          if git diff --quiet -- tests/test_sounding_analysis.py; then
            echo "Hainan regression is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_sounding_analysis.py
          git commit -m "Finalize Hainan H500 regression assertion"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  diagnostic:
    needs: migrate-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Render reference diagnostics
        shell: bash
        run: |
          mkdir -p artifacts/sounding-h500
          set +e
          python scripts/render_sounding_h500_regression.py 2>&1 | tee artifacts/sounding-h500/render.log
          first=${PIPESTATUS[0]}
          python scripts/render_sounding_h500_wind_experiment.py 2>&1 | tee artifacts/sounding-h500/wind-render.log
          second=${PIPESTATUS[0]}
          code=$(( first != 0 ? first : second ))
          echo "$code" > artifacts/sounding-h500/render.exit-code
          exit "$code"

      - name: Upload H500 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sounding-h500-regression
          path: artifacts/sounding-h500
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: migrate-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Run focused regression tests
        shell: bash
        run: |
          mkdir -p artifacts/sounding-h500-tests
          set +e
          pytest -vv --maxfail=8 \
            tests/test_contour_seeded_trough.py \
            tests/test_trough_ridge_features.py \
            tests/test_sounding_analysis.py \
            2>&1 | tee artifacts/sounding-h500-tests/pytest.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/sounding-h500-tests/pytest.exit-code
          exit "$code"

      - name: Upload focused regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sounding-h500-tests
          path: artifacts/sounding-h500-tests
          if-no-files-found: error
          retention-days: 14
