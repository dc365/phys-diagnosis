services:
  weather-diagnosis-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    environment:
      - WEATHER_DIAG_CONFIG_DIR=/app/configs
      - WEATHER_DIAG_DATA_DIR=/app/data
